<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680">
  <rect width="1200" height="680" fill="#e9f6ff"/>

  <text x="600" y="48" text-anchor="middle" font-size="34" font-family="Trebuchet MS, Arial" fill="#23465c" font-weight="700">Planisferio para ubicar océanos y continentes</text>

  <g transform="translate(74,78)">
    <rect x="0" y="0" width="1052" height="560" rx="22" fill="#dff2ff" stroke="#9cc2d9" stroke-width="3"/>

    <!-- Mapa mundial real (base Wikimedia) -->
    <image href="img-world-map.png" x="34" y="24" width="984" height="512" preserveAspectRatio="xMidYMid meet"/>

    <!-- Etiquetas de océanos -->
    <text x="120" y="300" font-size="26" font-family="Trebuchet MS, Arial" fill="#2b6f9e" font-weight="700">OCÉANO PACÍFICO</text>
    <text x="450" y="315" font-size="26" font-family="Trebuchet MS, Arial" fill="#2b6f9e" font-weight="700">OCÉANO ATLÁNTICO</text>
    <text x="740" y="390" font-size="24" font-family="Trebuchet MS, Arial" fill="#2b6f9e" font-weight="700">OCÉANO ÍNDICO</text>
    <text x="880" y="300" font-size="24" font-family="Trebuchet MS, Arial" fill="#2b6f9e" font-weight="700">OCÉANO PACÍFICO</text>
    <text x="450" y="62" font-size="24" text-anchor="middle" font-family="Trebuchet MS, Arial" fill="#2b6f9e" font-weight="700">OCÉANO GLACIAL ÁRTICO</text>
    <text x="525" y="548" font-size="24" text-anchor="middle" font-family="Trebuchet MS, Arial" fill="#2b6f9e" font-weight="700">OCÉANO AUSTRAL</text>

    <!-- Países de referencia para preguntas -->
    <circle cx="294" cy="426" r="7" fill="#d94b4b"/>
    <text x="306" y="423" font-size="19" font-family="Trebuchet MS, Arial" fill="#19384d" font-weight="700">Chile</text>

    <circle cx="324" cy="430" r="7" fill="#d94b4b"/>
    <text x="336" y="451" font-size="19" font-family="Trebuchet MS, Arial" fill="#19384d" font-weight="700">Argentina</text>

    <circle cx="723" cy="308" r="7" fill="#d94b4b"/>
    <text x="734" y="303" font-size="19" font-family="Trebuchet MS, Arial" fill="#19384d" font-weight="700">India</text>

    <circle cx="817" cy="251" r="7" fill="#d94b4b"/>
    <text x="828" y="244" font-size="19" font-family="Trebuchet MS, Arial" fill="#19384d" font-weight="700">Japón</text>

    <!-- Rosa de los vientos -->
    <g transform="translate(954,90)">
      <circle cx="0" cy="0" r="56" fill="#ffffff" stroke="#8eb6ca" stroke-width="3"/>
      <line x1="0" y1="-45" x2="0" y2="45" stroke="#6d96ae" stroke-width="3"/>
      <line x1="-45" y1="0" x2="45" y2="0" stroke="#6d96ae" stroke-width="3"/>
      <text x="0" y="-60" text-anchor="middle" font-size="20" font-family="Trebuchet MS, Arial" fill="#0b817d" font-weight="700">N</text>
      <text x="0" y="76" text-anchor="middle" font-size="20" font-family="Trebuchet MS, Arial" fill="#356ea1" font-weight="700">S</text>
      <text x="-61" y="6" text-anchor="middle" font-size="20" font-family="Trebuchet MS, Arial" fill="#d08a1f" font-weight="700">O</text>
      <text x="61" y="6" text-anchor="middle" font-size="20" font-family="Trebuchet MS, Arial" fill="#c84a4a" font-weight="700">E</text>
    </g>
  </g>
</svg>
