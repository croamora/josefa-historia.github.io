<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680">
  <rect width="1200" height="680" fill="#e8f6ff"/>

  <text x="600" y="54" text-anchor="middle" font-size="34" font-family="Trebuchet MS, Arial" fill="#24485f" font-weight="700">Planisferio simplificado: continentes y océanos</text>

  <rect x="40" y="90" width="1120" height="520" rx="22" fill="#d9f0ff" stroke="#9fc5db" stroke-width="3"/>

  <!-- Continentes (dibujo esquemático para práctica escolar) -->
  <path d="M135,180 L250,145 L300,170 L292,235 L248,280 L230,330 L180,360 L120,330 L105,270 L120,220 Z"
    fill="#f8d9a6" stroke="#c79b62" stroke-width="3"/>
  <path d="M290,325 L345,350 L360,410 L330,500 L290,570 L245,560 L228,495 L240,430 Z"
    fill="#f8d9a6" stroke="#c79b62" stroke-width="3"/>

  <path d="M515,160 L620,130 L705,165 L710,230 L655,285 L570,280 L520,225 Z"
    fill="#f8d9a6" stroke="#c79b62" stroke-width="3"/>
  <path d="M610,290 L680,302 L710,360 L690,450 L640,520 L575,495 L545,420 L565,350 Z"
    fill="#f8d9a6" stroke="#c79b62" stroke-width="3"/>

